<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TalentTop - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ====== Header المشترك ====== -->
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">🚀 TalentTop</a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="challenges.html" class="nav-link">Challenges</a>
                <a href="leaderboard.html" class="nav-link">Leaderboard</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <a href="admin.html" class="nav-link admin-link active" id="adminNavLink" style="display:none;">Admin</a>
            </nav>
            <div class="header-auth">
                <div id="headerLoggedOut">
                    <a href="auth.html" class="header-login-btn">Login</a>
                </div>
                <div id="headerLoggedIn" style="display:none;">
                    <span id="headerUsername"></span>
                    <button onclick="logout()" class="header-logout-btn">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">

        <h1 class="page-title" style="color:#1F2937; text-shadow:none;">🛠️ Admin Panel</h1>
        <p class="page-subtitle" style="color:#6B7280;">Manage challenges and evaluate submissions</p>

        <div id="adminSection">

            <!-- اضافة تحدي -->
            <div class="card">
                <h1>➕ Add Challenge</h1>
                <input id="newChallengeTitle" placeholder="Challenge Title"><br>
                <textarea id="newChallengeDescription" placeholder="Challenge Description"></textarea><br>
                <select id="newChallengeDifficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select><br>
                <button id="addChallengeBtn" onclick="addChallenge()">Add Challenge</button>
            </div>

            <!-- عرض الحلول المرسلة -->
            <div class="card">
                <h1>📋 Submissions</h1>
                <button onclick="loadSubmissions()">Load Submissions</button>
                <ul id="submissionsList"></ul>
            </div>

            <!-- تقييم حل -->
            <div class="card">
                <h1>✅ Evaluate Submission</h1>
                <input id="evalSubmissionId" placeholder="Submission ID"><br>
                <input id="evalScore" type="number" placeholder="Score (0-10)" min="0" max="10"><br>
                <textarea id="evalFeedback" placeholder="Feedback"></textarea><br>
                <button id="evaluateBtn" onclick="evaluateSubmission()">Submit Evaluation</button>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p>© 2026 TalentTop — Made with 💙 for young coders</p>
    </footer>

    <!-- الروبوت المرافق -->
    <div class="mascot-wrapper">
        <div class="mascot-bubble" id="mascotBubble">Click me for a tip! 💬</div>
        <div class="mascot-robot" id="mascotRobot" onclick="showMascotMessage()">
            <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="26" width="44" height="30" rx="10" fill="#E5E7EB"/>
                <circle cx="30" cy="16" r="16" fill="#F3F4F6"/>
                <circle cx="22" cy="14" r="4" fill="#14B8A6"/>
                <circle cx="38" cy="14" r="4" fill="#14B8A6"/>
                <rect x="20" y="24" width="20" height="4" rx="2" fill="#9CA3AF"/>
                <line x1="30" y1="-2" x2="30" y2="4" stroke="#9CA3AF" stroke-width="3"/>
                <circle cx="30" cy="-4" r="4" fill="#F97316"/>
            </svg>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
